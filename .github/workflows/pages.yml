name: deploy-dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "data/metadata/**"
      - "src/build_dashboard.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Rebuild dashboard from committed metadata
        run: python src/build_dashboard.py

      - name: Create Pages landing page
        run: cp docs/dashboard.html docs/index.html

      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
