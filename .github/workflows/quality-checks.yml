name: quality-checks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
      - run: python src/fetch_daily_counts.py
      - run: python src/fetch_category_counts.py
      - run: python src/baseline_backtest.py
      - run: python src/statistical_backtest.py
      - run: python src/ml_backtest.py
      - run: python src/model_comparison.py
      - run: python src/summarize_benchmark.py
      - run: python src/operational_forecast.py
      - run: python src/category_backtest.py
      - run: python src/summarize_categories.py
      - run: python src/validate_project.py
